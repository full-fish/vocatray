<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/pages.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>외운 단어</title>
    <script type="module" src="/src/words.ts" defer></script>
  </head>

  <body>
    <main class="page">
      <div class="bar">
        <input id="search" type="search" placeholder="검색 — 영어 또는 뜻" autocomplete="off" />
      </div>
      <!-- 진짜 외운 단어 = 퀴즈를 5번 연속 맞힌 단어. 탭 이름 옆 숫자는 words.ts가 채운다 -->
      <div id="tabs" class="tabs" role="tablist" aria-label="외운 단어 나누기">
        <button type="button" role="tab" data-tab="all">전체</button>
        <button type="button" role="tab" data-tab="mastered">진짜 외운 단어</button>
        <button type="button" role="tab" data-tab="plain">그냥 외운 단어</button>
      </div>
      <ul id="list"></ul>
      <p id="empty" class="hint" hidden></p>
    </main>
  </body>
</html>
